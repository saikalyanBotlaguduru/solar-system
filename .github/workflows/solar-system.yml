name: Solar System Workflow 

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{vars.MONGO_USERNAME}}
  MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}
jobs:
  unit-testing:
     name: Unit testing
     strategy:
        matrix:
          nodejs_version: [18,20]
          operating_system: [ubuntu-latest, macos-latest]
          exclude:
            - nodejs_version: 18
              operating_system: macos-latest
     runs-on: ${{matrix.operating_system}}
     steps:
     - name: Checkout Repository
       uses: actions/checkout@v7.0.1

     - name: Set up nodejs version ${{matrix.nodejs_version}}
       uses: actions/setup-node@v7.0.0
       with:
          node-version: ${{matrix.nodejs_version}}
     - name: Install dependencies
       run: npm  install

     - name: Unit testing
       id: nodejs-unit-testing-step
       run: npm test

     - name: Upload-archive a Build Artifact -unit test result
       if:   steps.nodejs-unit-testing-step.outcome == 'failure' || steps.nodejs-unit-testing-step.outcome == 'success'
       uses: actions/upload-artifact@v7.0.1
       with:
         name: Mocha - test result
         path: test-results.xml
    
  code-coverage:
    name: code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up node verions 18
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Check code coverage
        continue-on-error: true 
        run: npm run coverage 
      
      - name: Archive test results 
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Code-Coverage-Result
          path: coverage 
          retention-days: 3
    
      
        