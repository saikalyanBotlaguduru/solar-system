name: Solar System Workflow 

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{vars.MONGO_USERNAME}}
  MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}
jobs:
  unit-testing:
     name: Unit testing
     strategy:
        matrix:
          nodejs_version: [18,20]
          operating_system: [ubuntu-latest]
          exclude:
            - nodejs_version: 18
              operating_system: macos-latest
     runs-on: ${{matrix.operating_system}}
     steps:
     - name: Checkout Repository
       uses: actions/checkout@v7.0.1

     - name: Set up nodejs version ${{matrix.nodejs_version}}
       uses: actions/setup-node@v7.0.0
       with:
          node-version: ${{matrix.nodejs_version}}

     - name: Cache NPM dependencies
       uses: actions/cache@v6
       with: 
         path: node_modules
         key: ${{runner.os}}-node-modules-${{hashfiles('package-lock.json')}}

     - name: Install dependencies
       run: npm  install

     - name: Unit testing
       id: nodejs-unit-testing-step
       run: npm test

     - name: Upload-archive a Build Artifact -unit test result
       #if:   failure() && (steps.nodejs-unit-testing-step.outcome == 'failure' || steps.nodejs-unit-testing-step.outcome == 'success')
       if: always()
       uses: actions/upload-artifact@v7.0.1
       with:
         name: Mocha - test result
         path: test-results.xml
    
  code-coverage:
    name: code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up node verions 18
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 18
      
      - name: Cache NPM dependencies
        uses: actions/cache@v6
        with: 
          path: node_modules
          key: ${{runner.os}}-node-modules-${{hashfiles('package-lock.json')}}

      - name: Install dependencies
        run: npm install

      - name: Check code coverage
        continue-on-error: true 
        run: npm run coverage 
      
      - name: Archive test results 
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Code-Coverage-Result
          path: coverage 
          retention-days: 4
          
    
  docker:
     name: containerization
     needs: [unit-testing,code-coverage]
     runs-on: ubuntu-latest
     steps:
     - name: checkout Repository
       uses: actions/checkout@v7.0.1
    
     - name: Docker hub login
       uses: docker/login-action@v4.6.0
       with:
        username: ${{vars.DOCKERHUB_USERNAME}}
        password: ${{secrets.DOCKERHUB_PASSWORD}}

     - name: Git hub container registry Login
      uses: docker/login-action@v4.6.0
      with:
       registry: ghcr.io
       username: ${{github.repository_owner}}
       password: ${{secrets.GITHUB_TOKEN}}

     - name: Build Docker image and push 
      uses: docker/build-push-action@v4
      with:
            context: .
            push: false
            tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
    
     - name: Docker Image Testing
      run: |
            docker images
            docker run --name solar-system-app -d  \
                -p 3000:3000 \
                -e MONGO_URI=$MONGO_URI \
                -e MONGO_USERNAME=$MONGO_USERNAME \
                -e MONGO_PASSWORD=$MONGO_PASSWORD \
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            
            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo $IP
            
            echo Testing Image URL using wget 
            wget -q -O - 127.0.0.1:3000/live | grep live
    
     - name: Container push  image to hub
      uses: docker/build-push-action@v4
      with:
            context: .
            push: true
            tags: |
               ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
               ghcr.io/${{github.repository_owner}}/solar-system/:${{ github.sha }}
               
        